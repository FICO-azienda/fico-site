<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FICO</title>
<style>
  :root { --avorio: #F1EEE5; --inchiostro: #23241f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--avorio); }
  body { cursor: crosshair; }
  canvas { display: block; }

  /* velo d'ingresso: la scena non deve comparire a scatti mentre carica */
  #velo {
    position: fixed; inset: 0; background: var(--avorio); z-index: 5;
    transition: opacity .9s cubic-bezier(.22,1,.36,1); pointer-events: none;
  }
  body.pronto #velo { opacity: 0; }

  #avviso {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    font: 12px/1.5 ui-monospace, Menlo, monospace; color: #8a3324; z-index: 6;
  }

  .debug {
    position: fixed; top: 14px; right: 14px; width: 216px; z-index: 10;
    background: rgba(255,255,255,.7); backdrop-filter: blur(8px);
    border: 1px solid rgba(35,36,31,.16); padding: 9px 10px;
    font: 10.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--inchiostro);
  }
  .debug b { display: block; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    margin-bottom: 6px; opacity: .55; }
  .debug div > div { display: flex; justify-content: space-between; gap: 8px; }
  .debug div > div span:last-child { opacity: .75; text-align: right; }
  .debug button { margin-top: 7px; width: 100%; font: inherit; cursor: pointer;
    background: transparent; border: 1px solid rgba(35,36,31,.25); color: inherit; padding: 3px; }
  .debug button:hover { background: rgba(35,36,31,.06); }
</style>
</head>
<body>
<div id="velo"></div>
<div id="avviso"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
